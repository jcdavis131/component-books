<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component Books — 12-volume compendium</title>
  <meta name="description" content="A bookshelf of modern web components. 12 volumes, 214 plates. Build any site from the suite." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23C17C60'/%3E%3Cpath d='M8 8h4v16H8zM14 8h10v2H14zM14 12h8v2H14z' fill='white'/%3E%3C/svg%3E" />
  <style>
    /* Critical inline tokens for FOUC-less load - Japandi v4 */
    :root{
      --paper:#F9F6F0;--paper-2:#F5F1EB;--paper-3:#E8E0D5;--stone:#D4C4B0;--stone-2:#B8A99A;
      --ink:#2A2A2A;--ink-2:#4A4A4A;--terracotta:#C17C60;--clay:#A67B5B;--moss:#8A9A8B;
      --void:#1E2022;--void-2:#2A2E33;
      --radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-xl:24px;--radius-pill:999px;
      --shadow-sm:0 1px 2px rgba(30,32,34,.06),0 4px 12px rgba(30,32,34,.06);
      --shadow-md:0 2px 8px rgba(30,32,34,.08),0 12px 24px rgba(30,32,34,.08);
      --shadow-lg:0 8px 24px rgba(30,32,34,.12),0 24px 48px rgba(30,32,34,.12);

    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--paper);color:var(--ink)}
    body{margin:0;font-family:ui-sans-system,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  </style>
  <link rel="stylesheet" href="/src/styles.css" />

  <div id="app"></div>
